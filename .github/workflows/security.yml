name: Security

on:
  push:
    branches: [ main, staging, develop ]
  pull_request:
    branches: [ main, staging, develop ]

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CodeQL stays on a GitHub-hosted runner. The analysis bundle is roughly a
  # gigabyte and self-hosted CodeQL wants its own database directory and disk
  # headroom, which is a poor trade on a Pi that also runs the test suite.
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CLI
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:go'

  govulncheck:
    name: govulncheck
    runs-on: [ self-hosted, linux, ARM64, pi ]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout CLI
        uses: actions/checkout@v4

      - name: Checkout Engine (shipyard-core)
        uses: actions/checkout@v4
        with:
          repository: dock-at-the-yards/shipyard-core
          # GITHUB_TOKEN is scoped to this repository and cannot read the
          # private engine, so a fine-grained PAT (shipyard-core, read-only)
          # is used instead. Forks do not receive secrets.
          token: ${{ secrets.CORE_PAT }}
          path: shipyard-core

      # actions/checkout cannot write outside the workspace, so the engine is
      # moved up to the sibling path that the go.mod `replace` directive needs.
      - name: Move engine to sibling directory
        run: |
          rm -rf "$GITHUB_WORKSPACE/../shipyard-core"
          mv shipyard-core "$GITHUB_WORKSPACE/../shipyard-core"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan
        run: govulncheck ./...

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
