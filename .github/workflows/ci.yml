name: CI

# Runs on every push and pull request targeting a live branch.
#
#   develop  integration  dev channel
#   staging  pre-production  test channel
#   main     production  stable channel
#
# All jobs run on the Raspberry Pi (`self-hosted, linux, ARM64, pi`) except the
# race job, which has no choice but to stay on a GitHub-hosted runner: see the
# note on the `race` job below.

on:
  push:
    branches: [ main, staging, develop ]
  pull_request:
    branches: [ main, staging, develop ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & Test
    runs-on: [ self-hosted, linux, ARM64, pi ]
    # Forks receive no secrets, so the private engine cannot be fetched.
    # Skipped there rather than red.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout CLI
        uses: actions/checkout@v4

      # The evaluation engine lives in the private shipyard-core repo and is
      # wired in through a filesystem `replace` directive, so it must be
      # checked out as a sibling of this repository for the module to resolve.
      - name: Checkout Engine (shipyard-core)
        uses: actions/checkout@v4
        with:
          repository: dock-at-the-yards/shipyard-core
          # GITHUB_TOKEN is scoped to this repository and cannot read the
          # private engine, so a fine-grained PAT (shipyard-core, read-only)
          # is used instead. Forks do not receive secrets.
          token: ${{ secrets.CORE_PAT }}
          path: shipyard-core

      # actions/checkout cannot write outside the workspace, so the engine is
      # moved up to the sibling path that the go.mod `replace` directive needs.
      - name: Move engine to sibling directory
        run: |
          rm -rf "$GITHUB_WORKSPACE/../shipyard-core"
          mv shipyard-core "$GITHUB_WORKSPACE/../shipyard-core"

      # Must run before setup-go: the cache restore extracts into GOMODCACHE,
      # and if that resolves to the Pi's real ~/go/pkg/mod the restore fails
      # with "Can't unlink already-existing object: Permission denied".
      - name: Isolate the Go module cache
        run: |
          mkdir -p "$RUNNER_TEMP/gomodcache" "$RUNNER_TEMP/gocache"
          echo "GOMODCACHE=$RUNNER_TEMP/gomodcache" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/gocache" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: true
          cache-dependency-path: |
            go.sum

      - name: Download dependencies
        run: |
          go mod download
          go mod verify

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l . 2>/dev/null || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The Pi has a working Docker daemon, so the pkg/engine integration tests
      # run for real here. `-race` is deliberately absent; see the race job.
      - name: Test
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.out
          retention-days: 7

  # Kept on a GitHub-hosted runner because the race detector cannot start on the
  # Pi at all:
  #
  #   ThreadSanitizer: unsupported VMA range
  #   FATAL: Found 47 - Supported 48
  #
  # That is the arm64 kernel's 48-bit VA layout producing more memory regions
  # than the sanitizer's shadow mapping supports, and it is not something a
  # runner-side setting can change. Every other job runs on the Pi; this one is
  # the single GitHub-hosted exception in the repository.
  race:
    name: Test (race)
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout CLI
        uses: actions/checkout@v4

      - name: Checkout Engine (shipyard-core)
        uses: actions/checkout@v4
        with:
          repository: dock-at-the-yards/shipyard-core
          token: ${{ secrets.CORE_PAT }}
          path: shipyard-core

      - name: Move engine to sibling directory
        run: |
          rm -rf "$GITHUB_WORKSPACE/../shipyard-core"
          mv shipyard-core "$GITHUB_WORKSPACE/../shipyard-core"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: true
          cache-dependency-path: |
            go.sum

      - name: Download dependencies
        run: |
          go mod download
          go mod verify

      - name: Test with the race detector
        run: go test -race ./...

  cross-compile:
    name: Cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: [ self-hosted, linux, ARM64, pi ]
    needs: verify
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Checkout CLI
        uses: actions/checkout@v4

      - name: Checkout Engine (shipyard-core)
        uses: actions/checkout@v4
        with:
          repository: dock-at-the-yards/shipyard-core
          # GITHUB_TOKEN is scoped to this repository and cannot read the
          # private engine, so a fine-grained PAT (shipyard-core, read-only)
          # is used instead. Forks do not receive secrets.
          token: ${{ secrets.CORE_PAT }}
          path: shipyard-core

      - name: Move engine to sibling directory
        run: |
          rm -rf "$GITHUB_WORKSPACE/../shipyard-core"
          mv shipyard-core "$GITHUB_WORKSPACE/../shipyard-core"

      - name: Isolate the Go module cache
        run: |
          mkdir -p "$RUNNER_TEMP/gomodcache" "$RUNNER_TEMP/gocache"
          echo "GOMODCACHE=$RUNNER_TEMP/gomodcache" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/gocache" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'

      # GOOS/GOARCH are job-level so the smoke test below can see them; as
      # step-level env they were empty in that step, resolving the binary to
      # the literal path ./bin/shipyard--.
      - name: Build
        env:
          VERSION: ci-${{ github.sha }}
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -buildid= -X 'github.com/dock-at-the-yards/shipyard-cli/cmd/cmdline.Version=${VERSION}'" \
            -o "bin/shipyard-${GOOS}-${GOARCH}" ./cmd/shipyard/main.go

      # Only the natively-built binary can execute. The matrix builds amd64
      # artifacts from an arm64 host, and those cannot be run here (and QEMU is
      # not registered on the runner), so the gate is on the arm64 leg.
      - name: Smoke test (native platform only)
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: ./bin/shipyard-${{ matrix.goos }}-${{ matrix.goarch }} version

  installer:
    name: Installer self-test
    runs-on: [ self-hosted, linux, ARM64, pi ]
    needs: verify
    steps:
      - name: Checkout CLI
        uses: actions/checkout@v4

      - name: Syntax check
        run: bash -n install.sh

      - name: Usage and argument validation
        run: |
          ./install.sh --help
          # an unknown channel must fail loudly rather than silently defaulting
          if ./install.sh --channel bogus; then
            echo "::error::expected a non-zero exit for an invalid channel"; exit 1
          fi
          # a pinned, nonexistent version must fail with a clear message
          if ./install.sh --version v0.0.0-does-not-exist --dry-run; then
            echo "::error::expected a non-zero exit for a missing release"; exit 1
          fi

      - name: Shellcheck
        if: always()
        continue-on-error: true
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .
          files: install.sh
