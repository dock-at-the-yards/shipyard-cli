name: Dev Build

# Every push to develop produces an installable dev build.
#
# A tag is created, pushed, and the Release workflow is dispatched explicitly:
# tag pushes made with GITHUB_TOKEN never trigger workflows (GitHub's
# recursion rule), so relying on the push alone silently produces tags with no
# build. One code path still serves every channel — the release pipeline.
#
# The Release workflow prunes superseded dev prereleases, so the release list
# stays bounded at one dev build plus the permanent stable/test releases.

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: write
  # Dispatching release.yml after the tag push needs this.
  actions: write

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  tag:
    name: Tag the commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CLI
        uses: actions/checkout@v4

      - name: Create a dev tag
        id: tag
        run: |
          set -euo pipefail
          # Run number keeps tags unique and ordered even across reruns of the
          # same commit.
          TAG="v0.0.0-dev.${GITHUB_RUN_NUMBER}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Dispatch the Release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # A tag push made with GITHUB_TOKEN does not trigger workflows
          # (GitHub's recursion rule), so dispatch the release explicitly.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" -f tag="$TAG"
          echo "::notice::dispatched release.yml for $TAG"
