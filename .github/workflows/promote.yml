name: Promote

# Moves code up one tier. Never two, and never sideways.
#
#   develop ──▶ staging   test channel, pre-production
#   staging ──▶ main      prod channel, stable releases
#
# Work lands on develop through pull requests. Promotion is the only way code
# reaches staging or main, so both of those are protected branches whose only
# accepted input is this workflow's pull request.
#
# Run it with:  gh workflow run promote.yml --repo shivam-jainn/shipyard-cli
#
# Runs on ubuntu-latest rather than the Pi because it drives the GitHub API
# through the `gh` CLI, which is not installed on the runner image.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Tier to promote into'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      version:
        description: 'Version to release, e.g. 0.0.2 (production only; blank = derive from VERSION)'
        required: false
      dry_run:
        description: 'Open the PR but do not merge'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  # The merge step polls statusCheckRollup for the gates; without this the
  # query fails with "Resource not accessible by integration".
  checks: read

concurrency:
  group: promote-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote to ${{ inputs.target }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CLI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the tier
        id: tier
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          # The mapping is the tier policy in one place. A promotion that is not
          # listed here has no route, which is what makes skipping a level
          # impossible rather than merely discouraged.
          case "$TARGET" in
            staging)    SOURCE=develop; DEST=staging ;;
            production) SOURCE=staging; DEST=main ;;
            *) echo "::error::unknown target '$TARGET'"; exit 1 ;;
          esac

          git fetch origin "$SOURCE" "$DEST"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "dest=$DEST"     >> "$GITHUB_OUTPUT"
          echo "$SOURCE ($(git rev-parse --short "origin/$SOURCE")) -> $DEST ($(git rev-parse --short "origin/$DEST"))"

      - name: Check there is something to promote
        id: ahead
        env:
          SOURCE: ${{ steps.tier.outputs.source }}
          DEST: ${{ steps.tier.outputs.dest }}
        run: |
          set -euo pipefail
          # An empty promotion is not an error worth failing on, but it must not
          # silently produce a PR either: report it and stop. The test is
          # whether the source is already an ancestor of the destination;
          # testing the reverse would skip exactly the fast-forward case the
          # promotion exists for.
          if git merge-base --is-ancestor "origin/$SOURCE" "origin/$DEST"; then
            echo "::notice::$DEST already contains everything on $SOURCE"
            echo "promotable=false" >> "$GITHUB_OUTPUT"
          else
            echo "promotable=true" >> "$GITHUB_OUTPUT"
            git log --oneline "origin/$DEST..origin/$SOURCE" | sed 's/^/  /'
          fi

      - name: Validate the production version
        id: ver
        if: inputs.target == 'production' && steps.ahead.outputs.promotable == 'true'
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ] && [ -f VERSION ]; then
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::no version given and no VERSION file on staging"
            exit 1
          fi
          # The stable channel cannot carry a prerelease suffix; the tag shape
          # is what the release workflow classifies on.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a stable SemVer version (MAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Releasing a version main has already shipped produces a duplicate
          # tag and a confusing release. Catch it here rather than at the tag.
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists; bump VERSION for a new release"
            exit 1
          fi

      - name: Open the promotion pull request
        id: pr
        if: steps.ahead.outputs.promotable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: ${{ steps.tier.outputs.source }}
          DEST: ${{ steps.tier.outputs.dest }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail

          if [ "$DEST" = "main" ]; then
            TITLE="release: v${VERSION}"
            BODY="Promotes \`staging\` to \`main\` for **v${VERSION}**.

          \`staging\` is the pre-production environment; this is the step that
          makes the change public. Once this merges, tag and push:

          \`\`\`
          git checkout main
          git tag v${VERSION}
          git push origin v${VERSION}
          \`\`\`

          The Release workflow then publishes stable binaries and a container
          image, and repoints the \`stable\` channel."
          else
            TITLE="promote: develop to staging"
            BODY="Promotes \`develop\` to \`staging\`.

          \`staging\` is the pre-production environment and the source of the
          \`test\` channel. A prerelease tag here (\`-alpha.N\`, \`-beta.N\`,
          \`-rc.N\`) publishes a test build."
          fi

          # An open PR on the same hop means a promotion is already in flight;
          # opening a second one would race the first.
          EXISTING="$(gh pr list --base "$DEST" --head "$SOURCE" --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            echo "::notice::promotion #$EXISTING ($SOURCE -> $DEST) is already open"
            echo "number=$EXISTING" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          URL="$(gh pr create \
            --base "$DEST" --head "$SOURCE" \
            --title "$TITLE" --body "$BODY" \
            --label release 2>/dev/null || gh pr create \
            --base "$DEST" --head "$SOURCE" --title "$TITLE" --body "$BODY")"
          echo "::notice::opened $URL"
          echo "number=$(gh pr view "$URL" --json number --jq .number)" >> "$GITHUB_OUTPUT"

      - name: Merge once checks pass
        if: steps.pr.outputs.number != '' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          # No --auto and no --squash, deliberately. --auto needs the
          # auto-merge feature, which free private repos do not have, so the
          # same workflow would fail there. --squash violates the merge-only
          # rulesets on public repos, and it flattens history so the next
          # promotion would re-list already-promoted commits. Instead the
          # gates are awaited explicitly below, then merged with an explicit
          # merge commit, which preserves ancestry across promotions. Repos
          # with no gates configured (empty rollup) merge right away.
          GRACE_END=$(( $(date +%s) + 300 ))
          for i in $(seq 1 45); do
            ROLLUP="$(gh pr view "$NUMBER" --json statusCheckRollup --jq '.statusCheckRollup')"
            N="$(echo "$ROLLUP" | jq 'length')"
            FAILED="$(echo "$ROLLUP" | jq '[.[] | select(.conclusion == "FAILURE" or .conclusion == "CANCELLED" or .conclusion == "TIMED_OUT" or .conclusion == "ACTION_REQUIRED" or .conclusion == "STARTUP_FAILURE")] | length')"
            OPEN="$(echo "$ROLLUP" | jq '[.[] | select(.conclusion != "SUCCESS" and .conclusion != "NEUTRAL" and .conclusion != "SKIPPED")] | length')"
            if [ "$FAILED" -gt 0 ]; then
              echo "::error::a gate failed on PR #$NUMBER"
              echo "$ROLLUP" | jq -r '.[] | select(.conclusion == "FAILURE" or .conclusion == "CANCELLED" or .conclusion == "TIMED_OUT" or .conclusion == "ACTION_REQUIRED" or .conclusion == "STARTUP_FAILURE") | "\(.name): \(.conclusion)"'
              exit 1
            fi
            if [ "$N" -gt 0 ] && [ "$OPEN" -eq 0 ]; then
              echo "all gates green; merging"
              break
            fi
            if [ "$N" -eq 0 ] && [ "$(date +%s)" -ge "$GRACE_END" ]; then
              echo "::notice::no checks reported after 5 min; merging (no gates configured)"
              break
            fi
            echo "waiting on gates (attempt $i/45)..."
            sleep 60
            if [ "$i" -eq 45 ]; then
              echo "::error::gates still pending after 45 min on PR #$NUMBER"
              exit 1
            fi
          done
          gh pr merge "$NUMBER" --merge
          echo "::notice::merged promotion PR #$NUMBER"
