name: Build (self-hosted MBP)

# Builds the full release matrix on push to main/develop, and verifies pull
# requests. Runs on the self-hosted MacBook Pro runner (`shivams-mbp`).
#
# Note on layout: go.mod wires the engine in with a filesystem `replace`
# directive pointing at `../shipyard-core`, so the engine MUST be checked out
# as a SIBLING of this repo, not a subdirectory. `actions/checkout` resolves
# `path` relative to the workspace, hence `../shipyard-core`.

on:
  push:
    branches: [ main, staging, develop ]
  pull_request:
    branches: [ main, staging, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-mbp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: [ self-hosted, linux, ARM64, pi ]
    steps:
      - name: Checkout CLI
        uses: actions/checkout@v4

      # The private engine is not reachable by GITHUB_TOKEN, so a
      # fine-grained PAT (shipyard-core, read-only) is used instead.
      # actions/checkout refuses a path outside the workspace, so it lands in a
      # subdir and is then moved up to the sibling location the replace wants.
      - name: Checkout Engine (shipyard-core)
        uses: actions/checkout@v4
        with:
          repository: dock-at-the-yards/shipyard-core
          path: shipyard-core
          token: ${{ secrets.CORE_PAT }}
          # NOTE: actions/checkout has no `retry` input. Passing one produced
          # "Unexpected input(s) 'retry', 'retry-wait-seconds'" and was ignored,
          # so the fetch flake it was meant to fix was never actually handled.
          # The repo is ~200KB, so a wrapper retry would be cheap if needed.

      - name: Move engine to sibling directory
        run: |
          # Clear any leftover from a previous job in this run before moving.
          rm -rf "$GITHUB_WORKSPACE/../shipyard-core"
          mv shipyard-core "$GITHUB_WORKSPACE/../shipyard-core"
          echo "engine at $(cd "$GITHUB_WORKSPACE/../shipyard-core" && pwd)"

      # Must run before setup-go: that step's cache restore extracts into
      # GOMODCACHE. Unset, it resolves to the developer's real ~/go/pkg/mod
      # (3.2GB) and the restore fails with
      #   Can't unlink already-existing object: Permission denied
      - name: Isolate the Go module cache
        run: |
          mkdir -p "$RUNNER_TEMP/gomodcache" "$RUNNER_TEMP/gocache"
          echo "GOMODCACHE=$RUNNER_TEMP/gomodcache" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/gocache" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: true
          cache-dependency-path: |
            go.sum

      - name: Download dependencies
        run: |
          go mod download
          go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    runs-on: [ self-hosted, linux, ARM64, pi ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
    steps:
      - name: Checkout CLI
        uses: actions/checkout@v4

      - name: Checkout Engine (shipyard-core)
        uses: actions/checkout@v4
        with:
          repository: dock-at-the-yards/shipyard-core
          path: shipyard-core
          token: ${{ secrets.CORE_PAT }}
          # NOTE: actions/checkout has no `retry` input. Passing one produced
          # "Unexpected input(s) 'retry', 'retry-wait-seconds'" and was ignored,
          # so the fetch flake it was meant to fix was never actually handled.
          # The repo is ~200KB, so a wrapper retry would be cheap if needed.

      - name: Move engine to sibling directory
        run: |
          # Clear any leftover from a previous job in this run before moving.
          rm -rf "$GITHUB_WORKSPACE/../shipyard-core"
          mv shipyard-core "$GITHUB_WORKSPACE/../shipyard-core"
          echo "engine at $(cd "$GITHUB_WORKSPACE/../shipyard-core" && pwd)"

      # Must run before setup-go: that step's cache restore extracts into
      # GOMODCACHE. Unset, it resolves to the developer's real ~/go/pkg/mod
      # (3.2GB) and the restore fails with
      #   Can't unlink already-existing object: Permission denied
      - name: Isolate the Go module cache
        run: |
          mkdir -p "$RUNNER_TEMP/gomodcache" "$RUNNER_TEMP/gocache"
          echo "GOMODCACHE=$RUNNER_TEMP/gomodcache" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/gocache" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: true
          cache-dependency-path: |
            go.sum

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          VERSION="$(tr -d '[:space:]' < VERSION)"
          SHA="$(git rev-parse --short HEAD)"
          BUILD_VERSION="${VERSION}-dev.${SHA}"
          CHANNEL=dev
          PKG=github.com/dock-at-the-yards/shipyard-cli/cmd/cmdline
          LDFLAGS="-s -w -buildid="
          LDFLAGS="${LDFLAGS} -X '${PKG}.Version=${BUILD_VERSION}'"
          LDFLAGS="${LDFLAGS} -X '${PKG}.Commit=${SHA}'"
          LDFLAGS="${LDFLAGS} -X '${PKG}.Channel=${CHANNEL}'"
          # CGO_ENABLED=0 keeps the artifact statically linked, matching the
          # release pipeline and the Alpine runtime image.
          CGO_ENABLED=0 go build -trimpath -mod=readonly -ldflags="${LDFLAGS}" \
            -o "dist/shipyard-${BUILD_VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}" \
            ./cmd/shipyard/main.go
          tar -czf "dist/shipyard-${BUILD_VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" \
            -C dist "shipyard-${BUILD_VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shipyard-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
